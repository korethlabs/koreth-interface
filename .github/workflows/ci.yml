name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    # Sized so that hitting it is itself the diagnosis. A cold via-IR compile of core has been
    # observed at just over 30 minutes and a warm one takes a few, so 45 clears the worst
    # legitimate run while still cutting off anything that is stuck. That distinction is the
    # point: a job cancelled at a timeout we chose names its own cause, whereas a job the runner
    # reclaims reports only "exit 143" and looks like a compiler crash.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The interface does not compile without src/generated, and that is produced from core:
      # the ABIs it type-checks every contract call against come out of core's forge output.
      # Checking out and compiling core is therefore not optional here — it is what makes this
      # job able to catch an interface that has drifted from the contracts.
      - name: Check out koreth-v1-core
        uses: actions/checkout@v4
        with:
          repository: korethlabs/koreth-v1-core
          token: ${{ secrets.CORE_TOKEN }}
          submodules: recursive
          path: core

      # On the current runner image /mnt is not a separate disk — it lives on the root
      # filesystem, which ships ~98% full. The 12G swapfile below therefore lands on / and left
      # only ~1.5G free, so npm ci filled the disk and the runner agent (which also writes to /)
      # was killed mid-step with its logs lost. Reclaim the big unused toolchains first so both
      # the swapfile and the install have room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # via-IR compilation is memory-hungry and the 2-core/7GB runner OOMs without headroom.
      - name: Add swap space
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      # Node deps are installed before the core build so the cheap step fails fast, and so a
      # failure here is isolated from the memory-heavy forge build that follows.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned rather than `stable`, for the same reason the Solidity repos pin exactly: this job
      # compiles koreth-v1-core with via-IR (the "Build core" step) to generate the ABIs every
      # contract call here is type-checked against, so a forge that differs from the one the
      # contracts are tested with would type-check the interface against ABIs nobody else produced.
      # Keep this on the same version as koreth-v1-core and koreth-v1-periphery (v1.7.1) and bump
      # it deliberately, in the same commit as the version bump there.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # The run id in the key is what keeps this cache alive, and it is not optional.
      #
      # actions/cache saves nothing when the run began with an exact hit on the primary key: it
      # assumes the entry it restored is already current. Entries are also immutable, so a key that
      # hits can never be rewritten. Without the suffix the key here is
      # hashFiles('core/src/**/*.sol', 'core/foundry.toml') — core's sources, which a pull request
      # against *this* repository never touches. That makes it a constant. It hit on every run,
      # therefore saved on none, and stayed frozen at whatever the first job happened to store,
      # while forge recompiled the whole of core every time. Suffixing the run id makes every
      # primary key a miss, so every job saves and restore-keys does the fetching.
      #
      # The second way it freezes: actions/cache writes in a post step, and a job killed by the
      # runner never reaches its post step. So a run that dies preserves intact the stale entry
      # that made it slow enough to die. Both arms have the same consequence, and it is the one
      # worth knowing before touching this file — re-running a red build cannot fix it, because a
      # re-run restores the same entry, faces the same rebuild and dies the same way. The failure
      # is self-preserving, and pressing the button again is not a remedy however many times it is
      # pressed.
      - name: Cache core build
        uses: actions/cache@v4
        with:
          path: |
            core/out
            core/cache
          key: core-${{ runner.os }}-${{ hashFiles('core/src/**/*.sol', 'core/foundry.toml') }}-${{ github.run_id }}
          restore-keys: |
            core-${{ runner.os }}-${{ hashFiles('core/src/**/*.sol', 'core/foundry.toml') }}-
            core-${{ runner.os }}-

      # --threads 1 serializes solc so only one via-IR unit is resident at a time, capping peak
      # memory on the small 2-core runner during a cold full rebuild. It trades build time for
      # headroom, which is only affordable because the step above keeps the cache warm: a cold
      # serialized compile of the whole of core has been measured at just over 30 minutes, which
      # is long enough for a runner reclaim to land on it. Read a slow "Build core" as a cache
      # problem first, not as a compiler one.
      - name: Build core
        working-directory: core
        run: forge build --threads 1

      # Addresses come from a deployment that only exists on a running chain, so CI synthesizes
      # them; the ABIs above are real. See scripts/stub-core-deployment.mjs for why that is enough.
      - name: Generate src/generated
        env:
          CORE_ROOT: ${{ github.workspace }}/core
        run: |
          node scripts/stub-core-deployment.mjs
          npm run prepare-frontend

      # Reported separately from the build because a type error against a changed ABI is the
      # failure this job exists to catch, and it reads far better on its own than buried in
      # next build's output.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
