name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Without this, the only way to learn whether a commit builds is to create one. Every trigger
  # above is an event about a *change*, so a commit already sitting on main can never be asked the
  # question again — and a run that failed before it started leaves nothing to retry either, since
  # GitHub refuses to re-run a startup_failure. That combination has already produced a head on main
  # that no run has ever evaluated: three pull requests were merged during an outage in which jobs
  # were failed at allocation, and afterwards there was no way to interrogate the result short of
  # pushing another commit to main purely to provoke a run.
  #
  # So this is not a convenience. It is what makes the branch's state a question that can be asked
  # rather than only observed in passing, which is the property wanted after any interruption —
  # an infrastructure outage, a cache eviction, a dependency that changed underneath a green tick.
  workflow_dispatch:

concurrency:
  # Keyed on the event as well as the ref, and that only becomes necessary with workflow_dispatch in
  # the list above. A dispatch run reports github.ref as the branch it was started on, which for the
  # case this trigger exists for is the same value a push to main reports. Sharing a group with
  # cancel-in-progress means the two evict each other: asking main whether it builds would cancel
  # the CI of a merge landing at that moment, and that merge would cancel the answer. Both are
  # losses of exactly the signal being sought, and adding the trigger is what introduces them.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No lint job here yet, and that is a statement about the *findings*, not about the cost.
  #
  # On cost, lint is the one check that would not have to pay for the job below: measured by
  # running `npx eslint .` in a fresh clone with src/generated absent and no Foundry installed,
  # the result was identical to a full working tree — 50 files, same three findings. Nothing in
  # eslint-config-next@16 resolves an import or asks for type information (no import/no-unresolved,
  # and typescript-eslint runs without a `project`), so unresolved `@/generated/*` imports are
  # invisible to it. A lint job is therefore checkout + setup-node + npm ci + eslint, seconds,
  # with none of the via-IR compile that dominates the job below.
  #
  # What blocks it is that `npm run lint` currently exits 1 on three pre-existing errors that
  # predate the config being committed (two react-hooks/set-state-in-effect in src/app/borrow,
  # one react-hooks/preserve-manual-memoization in src/hooks/useAcceptedCollateral.ts). Wiring the
  # job before those are decided would put main red on the first push, and the two ways to avoid
  # that — continue-on-error, or switching the rules off to get a tick — both produce a check that
  # passes without checking, which is the state this repo was already in when `next lint` had been
  # silently broken since the Next 16 bump. Add the job in the same change that resolves them.
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    env:
      # Single-sourced because it is used twice: the toolchain installs it, and the build cache is
      # keyed on it. Those must never disagree. Keep it on the same version as koreth-v1-core and
      # koreth-v1-periphery, and bump it deliberately, in the same commit as the bump there.
      FOUNDRY_VERSION: v1.7.1
    # Sized so that hitting it is itself the diagnosis rather than a mystery. With core's tests
    # and scripts skipped the build is minutes, so 20 is far above any healthy run while still
    # cutting off anything stuck. That distinction is the point: a job cancelled at a limit we
    # chose names its own cause, whereas a job the runner reclaims reports only "exit 143" and
    # reads like a compiler crash.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # This job's next step checks out a *private sibling repository*, so its single most likely
      # failure is a credential rather than the code under test. Without this guard that arrives as
      # a git authentication error under a step named after the repo, which reads as "the repo moved
      # or the ref is wrong" and sends the next person down the wrong investigation.
      #
      # It buys legibility rather than safety: no step here is conditional, so a failed checkout
      # already fails the run. That is the property to preserve — the way a missing credential turns
      # into a green tick is by gating later steps on a boolean derived from it, which makes a total
      # outage look like a series of reasonable skips. Do not introduce one.
      #
      # An empty token is checked rather than a broken one because the two fail differently, and
      # counterintuitively: an *invalid* token already fails loudly at clone time, while an absent
      # one is the quiet case. The more complete outage is the less visible of the two.
      - name: Require SUBMODULE_TOKEN to be set
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo "::error::SUBMODULE_TOKEN is not available to this run, so koreth-v1-core cannot be checked out and no ABIs can be generated. Either the secret is unset in the repository, or GitHub has withheld it (as it does for pull requests from forks). This is not a problem with the code being built."
            exit 1
          fi

      # The interface does not compile without src/generated, and that is produced from core:
      # the ABIs it type-checks every contract call against come out of core's forge output.
      # Checking out and compiling core is therefore not optional here — it is what makes this
      # job able to catch an interface that has drifted from the contracts.
      - name: Check out koreth-v1-core
        uses: actions/checkout@v7
        with:
          repository: korethlabs/koreth-v1-core
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          path: core

      # On the current runner image /mnt is not a separate disk — it lives on the root
      # filesystem, which ships ~98% full. The 12G swapfile below therefore lands on / and left
      # only ~1.5G free, so npm ci filled the disk and the runner agent (which also writes to /)
      # was killed mid-step with its logs lost. Reclaim the big unused toolchains first so both
      # the swapfile and the install have room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # via-IR compilation is memory-hungry and the 2-core/7GB runner OOMs without headroom.
      - name: Add swap space
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      # Node deps are installed before the core build so the cheap step fails fast, and so a
      # failure here is isolated from the memory-heavy forge build that follows.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned rather than `stable`, for the same reason the Solidity repos pin exactly: this job
      # compiles koreth-v1-core with via-IR (the "Build core" step) to generate the ABIs every
      # contract call here is type-checked against, so a forge that differs from the one the
      # contracts are tested with would type-check the interface against ABIs nobody else produced.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # Two things about this key are load-bearing, and both were learned the hard way.
      #
      # The run id: actions/cache saves nothing when the run began with an exact hit on the primary
      # key, since it assumes what it restored is already current, and entries are immutable so a
      # key that hits can never be rewritten. Keyed only on core's sources — which a pull request
      # against *this* repository never touches — the key was a constant. It hit on every run,
      # therefore saved on none, and stayed frozen at whatever the first job stored. The API showed
      # it plainly: one entry, created once, last_accessed_at advancing for days while created_at
      # never moved. `gh api repos/<owner>/<repo>/actions/caches` is the fastest way to see this,
      # and it does not require reading a single run log.
      #
      # The Foundry version: artifacts are only reusable by the toolchain that produced them, so a
      # version bump silently invalidates every cached artifact while leaving the key identical.
      # Hashing foundry.toml does not cover this — the config is not the compiler. Naming the
      # version in the key means a bump gets a fresh namespace instead of poisoning the old one.
      #
      # What is *not* a fix: pressing re-run. actions/cache writes in a post step, so a job the
      # runner kills never saves, and a run that dies leaves intact the entry that made it slow
      # enough to die. Both of the above and this one converge on the same point — a re-run
      # restores the same entry, faces the same work and fails the same way. The failure preserves
      # its own cause, however many times the button is pressed.
      - name: Cache core build
        uses: actions/cache@v6
        with:
          path: |
            core/out
            core/cache
          key: core-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('core/src/**/*.sol', 'core/foundry.toml') }}-${{ github.run_id }}
          restore-keys: |
            core-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('core/src/**/*.sol', 'core/foundry.toml') }}-
            core-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-

      # This job needs eight ABIs, all of them from core's src/ — the list is in
      # scripts/core-artifacts.mjs. Compiling core's tests and scripts to produce them is work
      # nothing here consumes, and under via-IR it is most of the cost: measured on one machine,
      # cold, the full build is 197 files in 623s while --skip test --skip script is 112 files in
      # 11s. That is the difference between a build long enough for the runner to reclaim the VM
      # mid-compile and one that finishes well inside any window.
      #
      # This does not weaken the check. prepare-frontend.mjs reads each artifact by path, so an
      # artifact that --skip wrongly excluded is a hard read failure, not a silently thinner
      # binding. Core's tests are still compiled and run — in core's own CI, which is where they
      # belong.
      #
      # --threads 1 serializes solc so one via-IR unit is resident at a time, capping peak memory
      # on the 2-core runner. Kept as-is: the skip above is the variable being changed here, and
      # core measured a cold build peaking near 12GB, so the headroom is not obviously spare.
      - name: Build core
        working-directory: core
        run: forge build --skip test --skip script --threads 1

      # Addresses come from a deployment that only exists on a running chain, so CI synthesizes
      # them; the ABIs above are real. See scripts/stub-core-deployment.mjs for why that is enough.
      - name: Generate src/generated
        env:
          CORE_ROOT: ${{ github.workspace }}/core
        run: |
          node scripts/stub-core-deployment.mjs
          npm run prepare-frontend

      # Reported separately from the build because a type error against a changed ABI is the
      # failure this job exists to catch, and it reads far better on its own than buried in
      # next build's output.
      - name: Typecheck
        run: npx tsc --noEmit

      # Next 16 builds with Turbopack by default, which inverted what this job covers: the step
      # below used to be a webpack build and now is not, leaving the webpack half of next.config.js
      # — the half that is actually load-bearing — exercised by nothing. That half ignores the
      # optional @x402/* modules which @coinbase/cdp-sdk imports and which are not installed;
      # webpack resolves them eagerly through the @wagmi/connectors barrel, Turbopack tree-shakes
      # them away and never sees them. So Turbopack builds green whether the ignore is there or
      # not, and only a webpack build can tell you it was deleted. Measured by deleting it:
      # `next build --webpack` exits 1 on "Can't resolve '@x402/evm/upto/client'" while
      # `next build` exits 0 with no mention of x402 at all.
      #
      # A step rather than a job, because a job cannot inherit src/generated: it would have to
      # check out the private koreth-v1-core again and recompile it under via-IR, which is where
      # nearly all of this job's time goes, to add a build that takes seconds. Both builds share
      # one workspace and one .next, which is safe here — nothing restores .next between runs (the
      # cache above covers only core/out and core/cache), and running the two back to back in
      # either order was measured green. webpack runs first so the .next a passing job leaves
      # behind is Turbopack's, matching what actually gets deployed.
      - name: Build with webpack
        run: npx next build --webpack

      - name: Build
        run: npm run build
