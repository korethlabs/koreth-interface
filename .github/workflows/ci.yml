name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # This job's next step checks out a *private sibling repository*, so its single most likely
      # failure is a credential rather than the code under test. Without this guard that arrives as
      # a git authentication error under a step named after the repo, which reads as "the repo moved
      # or the ref is wrong" and sends the next person down the wrong investigation.
      #
      # It buys legibility rather than safety: no step here is conditional, so a failed checkout
      # already fails the run. That is the property to preserve — the way a missing credential turns
      # into a green tick is by gating later steps on a boolean derived from it, which makes a total
      # outage look like a series of reasonable skips. Do not introduce one.
      #
      # An empty token is checked rather than a broken one because the two fail differently, and
      # counterintuitively: an *invalid* token already fails loudly at clone time, while an absent
      # one is the quiet case. The more complete outage is the less visible of the two.
      - name: Require CORE_TOKEN to be set
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          if [ -z "$CORE_TOKEN" ]; then
            echo "::error::CORE_TOKEN is not set, so koreth-v1-core cannot be checked out and no ABIs can be generated. This is a credentials problem, not a problem with the code in this pull request."
            exit 1
          fi

      # The interface does not compile without src/generated, and that is produced from core:
      # the ABIs it type-checks every contract call against come out of core's forge output.
      # Checking out and compiling core is therefore not optional here — it is what makes this
      # job able to catch an interface that has drifted from the contracts.
      - name: Check out koreth-v1-core
        uses: actions/checkout@v4
        with:
          repository: korethlabs/koreth-v1-core
          token: ${{ secrets.CORE_TOKEN }}
          submodules: recursive
          path: core

      # On the current runner image /mnt is not a separate disk — it lives on the root
      # filesystem, which ships ~98% full. The 12G swapfile below therefore lands on / and left
      # only ~1.5G free, so npm ci filled the disk and the runner agent (which also writes to /)
      # was killed mid-step with its logs lost. Reclaim the big unused toolchains first so both
      # the swapfile and the install have room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # via-IR compilation is memory-hungry and the 2-core/7GB runner OOMs without headroom.
      - name: Add swap space
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      # Node deps are installed before the core build so the cheap step fails fast, and so a
      # failure here is isolated from the memory-heavy forge build that follows.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned rather than `stable`, for the same reason the Solidity repos pin exactly: this job
      # compiles koreth-v1-core with via-IR (the "Build core" step) to generate the ABIs every
      # contract call here is type-checked against, so a forge that differs from the one the
      # contracts are tested with would type-check the interface against ABIs nobody else produced.
      # Keep this on the same version as koreth-v1-core and koreth-v1-periphery (v1.7.1) and bump
      # it deliberately, in the same commit as the version bump there.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Cache core build
        uses: actions/cache@v4
        with:
          path: |
            core/out
            core/cache
          key: core-${{ runner.os }}-${{ hashFiles('core/src/**/*.sol', 'core/foundry.toml') }}
          restore-keys: core-${{ runner.os }}-

      # --threads 1 serializes solc so only one via-IR unit is resident at a time, capping peak
      # memory on the small 2-core runner during a cold full rebuild. Trades build time for
      # headroom; warm-cache runs skip the rebuild entirely.
      - name: Build core
        working-directory: core
        run: forge build --threads 1

      # Addresses come from a deployment that only exists on a running chain, so CI synthesizes
      # them; the ABIs above are real. See scripts/stub-core-deployment.mjs for why that is enough.
      - name: Generate src/generated
        env:
          CORE_ROOT: ${{ github.workspace }}/core
        run: |
          node scripts/stub-core-deployment.mjs
          npm run prepare-frontend

      # Reported separately from the build because a type error against a changed ABI is the
      # failure this job exists to catch, and it reads far better on its own than buried in
      # next build's output.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
